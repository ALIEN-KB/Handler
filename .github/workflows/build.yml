name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Handler-v$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk out/Handler.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Handler-apk
          path: out/*.apk

      # Every push to main publishes (or refreshes) the release for the current version.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Handler v${{ steps.apk.outputs.version }}
          make_latest: true
          overwrite_files: true
          body: |
            ### Install
            Download **Handler.apk** below and open it on your phone.
            Updating? Install it over the old version. Don't uninstall first, or you'll need the ADB command again.

            ### One-time setup
            ```
            adb shell pm grant com.alienkb.handler android.permission.WRITE_SECURE_SETTINGS
            ```
            Full guide in the [README](https://github.com/${{ github.repository }}#one-time-setup-the-important-bit).
          files: out/*.apk
